name: Build and test
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: nix develop -c ./gradlew --no-daemon assembleDebug assembleRelease
      - run: nix develop -c python3 tests/verify-apk.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OkcAgent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
